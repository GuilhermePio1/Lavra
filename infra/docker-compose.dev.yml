name: lavra-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: lavra-postgres
    environment:
      POSTGRES_USER: lavra
      POSTGRES_PASSWORD: lavra_dev # dev only — never reuse outside localhost
      POSTGRES_DB: lavra
    ports:
      # Published on 5433, not 5432: a PostgreSQL installed natively on the
      # developer's machine already owns the default port, and it wins the bind
      # silently — the application then talks to the wrong database and fails
      # with a confusing authentication error. Anyone cloning this repository is
      # likely to have one, so the emulator steps aside.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavra"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Azure Blob Storage emulator
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: lavra-azurite
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

  # SQL Server backing store required by the Service Bus emulator
  sqledge:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: lavra-sqledge
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LavraDev!Passw0rd" # dev only
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'LavraDev!Passw0rd' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Azure Service Bus emulator (queues defined in servicebus-config.json)
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: lavra-servicebus
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: "LavraDev!Passw0rd"
    ports:
      - "5672:5672"
    volumes:
      - ./servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    depends_on:
      sqledge:
        condition: service_healthy

  # OIDC emulator standing in for Entra External ID (ADR-0012).
  # `hostname: host.docker.internal` makes the issuer URL resolve identically
  # from inside the compose network and from the browser on the host.
  # `$${subject}` is escaped so compose does not interpolate it: the mock server
  # expands it to whatever user name is typed on the interactive login screen.
  #
  # The mapping MUST match on `subject`. Matching on `scope` looks equivalent but
  # is not: the authorization code exchange carries no `scope` form parameter, so
  # the mapping never fires, the token comes out with no `aud`, and the core-api
  # rejects it with 401. Matching on `subject` is also what makes `$${subject}`
  # resolve at all.
  #
  # `roles` is deliberately absent: claims set by the mapping cannot be
  # overridden from the login screen, so leaving it out is what allows typing
  # {"roles": ["ADMIN"]} there to grant yourself the admin role.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:5.0.2
    container_name: lavra-oidc
    hostname: host.docker.internal
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      JSON_CONFIG: >
        {
          "interactiveLogin": true,
          "tokenCallbacks": [
            {
              "issuerId": "lavra",
              "requestMappings": [
                {
                  "requestParam": "subject",
                  "match": "*",
                  "claims": {
                    "aud": ["api://lavra-core"],
                    "oid": "$${subject}",
                    "tid": "11111111-1111-1111-1111-111111111111",
                    "preferred_username": "$${subject}@lavra.dev",
                    "name": "$${subject}"
                  }
                }
              ]
            }
          ]
        }

volumes:
  pgdata:
  azurite-data:

# Connection strings for local development:
#   Postgres:    jdbc:postgresql://localhost:5433/lavra (lavra / lavra_dev)
#   Blob:        UseDevelopmentStorage=true  (Azurite well-known account)
#   Service Bus: Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
#   OIDC issuer: http://host.docker.internal:8081/lavra
#     discovery: http://host.docker.internal:8081/lavra/.well-known/openid-configuration
#     get a token by hand: http://host.docker.internal:8081/lavra/debugger
#       (NOT localhost:8081 — mock-oauth2-server stamps `iss` from the Host
#       header it received, so a token fetched via localhost carries
#       iss=http://localhost:8081/lavra and core-api, configured for
#       host.docker.internal, rejects it with a 401 that gives no reason why)
#     add claims (e.g. "roles": ["ADMIN"]) on the interactive login screen
