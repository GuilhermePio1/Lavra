openapi: 3.1.0
info:
  title: lavra Core API
  version: "1.1.0"
  license:
    name: PolyForm Noncommercial License 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0/
  description: >
    REST API do lavra. Fonte da verdade do contrato frontend → core-api.
    O código segue este contrato, não o contrário.

    Revisão 1.1.0 (ADR-0011): o áudio bruto deixou de trafegar pela API.
    POST /episodes passou de multipart para JSON e devolve uma SAS de escrita;
    o browser envia o arquivo direto ao Blob e confirma em
    POST /episodes/{episodeId}/upload-complete. Alteração breaking aplicada na
    v1 em vez de gerar v2 por não haver implementação nem cliente consumindo
    este contrato.

servers:
  - url: /api/v1

security:
  - bearerAuth: []

paths:
  /me:
    get:
      operationId: getCurrentUser
      summary: Perfil do usuário autenticado, plano vigente e consumo do período
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /episodes:
    post:
      operationId: createEpisodeUpload
      summary: Registra um novo episódio e emite a SAS para o upload do áudio bruto
      description: >
        Valida posse do show e saldo de cota, cria o episódio em PENDING_UPLOAD e
        devolve uma SAS de escrita restrita ao blob do próprio episódio. O arquivo
        NÃO é enviado neste request: o cliente faz PUT em blocos direto no Blob
        Storage usando a SAS e depois chama upload-complete. O pipeline só arranca
        na confirmação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeUploadRequest"
      responses:
        "201":
          description: Episódio criado em PENDING_UPLOAD; SAS emitida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeUploadTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Cota do plano esgotada (code = PLAN_QUOTA_EXCEEDED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: sizeBytes declarado excede o limite de 2 GB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listEpisodes
      summary: Lista episódios do usuário, opcionalmente filtrados por show
      parameters:
        - name: showId
          in: query
          required: false
          description: >
            Restringe ao show informado; deve ser do usuário autenticado
            (404 caso contrário). Omitido, lista os episódios de todos os shows
            do usuário.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EpisodeStatus"
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de episódios, mais recentes primeiro.
          content:
            application/json:
              schema:
                type: object
                required: [items, page, totalItems]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Episode"
                  page: { type: integer }
                  totalItems: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /episodes/{episodeId}/upload-ticket:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    post:
      operationId: renewEpisodeUploadTicket
      summary: Reemite a SAS de escrita de um upload em andamento
      description: >
        Para uploads longos cuja SAS expira antes do fim. Não recria o episódio nem
        recheca cota — apenas emite nova SAS para o mesmo blob, preservando os
        blocos já enviados.
      responses:
        "200":
          description: Nova SAS emitida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeUploadTicket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Episódio não está em PENDING_UPLOAD.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /episodes/{episodeId}/upload-complete:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    post:
      operationId: completeEpisodeUpload
      summary: Confirma que o áudio bruto foi enviado ao Blob e inicia o pipeline
      description: >
        Valida o blob gravado (existência, tamanho e Content-Type conforme o
        declarado na criação), transiciona PENDING_UPLOAD → RECEIVED, publica
        episode.uploaded.v1 e segue para AUDIO_PROCESSING. Idempotente: chamar de
        novo com o episódio já em RECEIVED (ou adiante) devolve 200 sem republicar
        o evento.
      responses:
        "200":
          description: Upload confirmado; pipeline iniciado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "400":
          description: >
            Blob ausente ou divergente do declarado
            (code = UPLOAD_NOT_FOUND | UPLOAD_MISMATCH).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Episódio já falhou ou foi expirado pelo job de limpeza.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /episodes/{episodeId}:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    get:
      operationId: getEpisode
      summary: Detalhe do episódio (estado + histórico de transições)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeDetail"
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"

  /episodes/{episodeId}/content:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    get:
      operationId: getEpisodeContent
      summary: Conteúdo gerado (títulos, descrição, capítulos, tags)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeContent"
          description: OK
        "409":
          description: Episódio ainda não chegou a IN_REVIEW.
    patch:
      operationId: updateEpisodeContent
      summary: Edita campos do conteúdo em revisão
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeContentPatch"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeContent"
          description: Conteúdo atualizado.
        "409":
          description: Episódio não está em IN_REVIEW.

  /episodes/{episodeId}/content/regenerate:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    post:
      operationId: regenerateArtifact
      summary: Regenera um artefato específico via IA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [artifact]
              properties:
                artifact:
                  type: string
                  enum: [TITLES, DESCRIPTION, CHAPTERS, TAGS]
                instruction:
                  type: string
                  maxLength: 500
                  description: Instrução opcional do criador ("menos formal", etc.).
      responses:
        "202":
          description: Regeneração iniciada.
        "409":
          description: Episódio não está em IN_REVIEW.

  /episodes/{episodeId}/approve:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    post:
      operationId: approveEpisode
      summary: Aprova o episódio (IN_REVIEW → READY) e alimenta o perfil de voz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
          description: Aprovado.
        "409":
          description: Episódio não está em IN_REVIEW.

  /episodes/{episodeId}/export:
    parameters:
      - $ref: "#/components/parameters/EpisodeId"
    get:
      operationId: exportEpisode
      summary: Links e textos finais para publicação
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [audioUrl, content]
                properties:
                  audioUrl:
                    type: string
                    format: uri
                    description: URL temporária (SAS) do áudio final.
                  content:
                    $ref: "#/components/schemas/EpisodeContent"
          description: OK
        "409":
          description: Episódio não está em READY.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access token OIDC emitido pelo Microsoft Entra External ID (ADR-0009).
        Autorização de negócio (posse, plano, cota) é aplicada pelo core-api:
        recurso de outro usuário retorna 404; cota esgotada retorna 403.

  parameters:
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Requisição inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: >
        Recurso não encontrado — inclusive quando o recurso existe mas pertence
        a outro usuário (posse estrita, spec 0004).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Token ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    EpisodeStatus:
      type: string
      enum:
        - PENDING_UPLOAD
        - RECEIVED
        - AUDIO_PROCESSING
        - TRANSCRIBING
        - GENERATING
        - IN_REVIEW
        - READY
        - FAILED

    EpisodeUploadRequest:
      type: object
      required: [showId, filename, contentType, sizeBytes]
      properties:
        showId:
          type: string
          format: uuid
          description: Show ao qual o episódio pertence; deve ser do usuário autenticado.
        filename:
          type: string
          maxLength: 255
          description: Nome original do arquivo; só a extensão é usada no caminho do blob.
        contentType:
          type: string
          description: Deve casar com o Content-Type enviado ao Blob no PUT.
          enum:
            - audio/mpeg
            - audio/wav
            - audio/x-wav
            - audio/mp4
            - audio/flac
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483648
          description: Tamanho declarado, validado contra o blob no upload-complete.
        title:
          type: string
          maxLength: 200
          description: Título de trabalho (opcional; a IA sugerirá títulos).

    EpisodeUploadTicket:
      type: object
      required: [episode, upload]
      properties:
        episode:
          $ref: "#/components/schemas/Episode"
        upload:
          type: object
          required: [url, blobPath, expiresAt]
          properties:
            url:
              type: string
              format: uri
              description: >
                SAS de escrita, restrita a este blob e sem permissão de leitura ou
                listagem. O cliente envia em blocos com o SDK do Azure Storage.
            blobPath:
              type: string
              description: Caminho relativo ao contêiner, ex. raw/{episodeId}/original.mp3.
              examples: ["raw/6f1d2c3a-0000-0000-0000-000000000000/original.mp3"]
            expiresAt:
              type: string
              format: date-time
              description: >
                Expiração da SAS (2 h). Upload longo que ultrapasse o prazo pede
                uma nova SAS em POST /episodes/{episodeId}/upload-ticket e retoma
                os blocos que faltam — não é preciso recomeçar.

    Episode:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        workingTitle: { type: string }
        status:
          $ref: "#/components/schemas/EpisodeStatus"
        durationSeconds: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EpisodeDetail:
      allOf:
        - $ref: "#/components/schemas/Episode"
        - type: object
          properties:
            failure:
              type: object
              description: Presente apenas quando status = FAILED.
              properties:
                stage: { type: string }
                errorCode: { type: string }
                errorMessage: { type: string }
                retryable: { type: boolean }
            transitions:
              type: array
              items:
                type: object
                required: [fromStatus, toStatus, at]
                properties:
                  fromStatus: { $ref: "#/components/schemas/EpisodeStatus" }
                  toStatus: { $ref: "#/components/schemas/EpisodeStatus" }
                  at: { type: string, format: date-time }

    EpisodeContent:
      type: object
      required: [titles, description, chapters, tags]
      properties:
        titles:
          type: array
          minItems: 3
          maxItems: 5
          items: { type: string, maxLength: 90 }
        selectedTitleIndex:
          type: integer
          description: Índice do título escolhido pelo criador.
        description:
          type: string
        chapters:
          type: array
          items:
            type: object
            required: [startSeconds, title]
            properties:
              startSeconds: { type: number }
              title: { type: string, maxLength: 60 }
        tags:
          type: array
          items: { type: string }

    EpisodeContentPatch:
      type: object
      description: Todos os campos opcionais; apenas os enviados são atualizados.
      properties:
        titles:
          type: array
          items: { type: string, maxLength: 90 }
        selectedTitleIndex: { type: integer }
        description: { type: string }
        chapters:
          type: array
          items:
            type: object
            required: [startSeconds, title]
            properties:
              startSeconds: { type: number }
              title: { type: string, maxLength: 60 }
        tags:
          type: array
          items: { type: string }

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Código estável, ex. PLAN_QUOTA_EXCEEDED, VALIDATION_ERROR.
        message: { type: string }

    UserProfile:
      type: object
      required: [id, email, plan, usage]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        plan:
          type: object
          required: [code, name]
          properties:
            code:
              type: string
              enum: [FREE, CREATOR, STUDIO]
            name: { type: string }
        usage:
          type: object
          required:
            - periodStart
            - periodEnd
            - processedMinutesUsed
            - processedMinutesLimit
            - showsUsed
            - showsLimit
          properties:
            periodStart: { type: string, format: date-time }
            periodEnd: { type: string, format: date-time }
            processedMinutesUsed:
              type: integer
              description: Pode exceder o limite (overdraft único, spec 0004).
            processedMinutesLimit: { type: integer }
            showsUsed: { type: integer }
            showsLimit: { type: integer }
